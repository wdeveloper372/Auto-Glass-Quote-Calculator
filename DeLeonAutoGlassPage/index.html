<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow"> <!-- Prevents search engine indexing -->
    <title>De Leon Auto Glass Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <h1>De Leon Auto Glass Calculator</h1>
        <form id="calculatorForm">
            <label for="partsAmount">Parts Amount:</label>
            <input type="number" id="partsAmount" step="0.01" required value="0">

            <label for="needsKit">Does it need a kit?</label>
            <select id="needsKit">
                <option value="y">Yes</option>
                <option value="n">No</option>
            </select>

            <label for="labor">Labor:</label>
            <input type="number" id="labor" step="0.01" required value="0">

            <label for="calibration">Calibration Rate:</label>
            <input type="number" id="calibration" step="0.01" required value="0">

            <button type="submit">Calculate</button>
            <button type="reset">Reset</button>
        </form>

        <div id="results" aria-live="polite">
            <p><strong>Results:</strong></p>
            <p>Parts (incl. profit): <span id="displayParts">$0.00</span></p>
            <p>Tax on Parts: <span id="displayPartTax">$0.00</span></p>
            <p>Kit Cost (incl. tax): <span id="displayKitCost">$0.00</span></p>
            <p>Labor: <span id="displayLabor">$0.00</span></p>
            <p>Calibration: <span id="displayCalibration">$0.00</span></p>
            <p class="highlight">Total: <span id="displayTotal">$0.00</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
