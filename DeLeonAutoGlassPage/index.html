<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Glass Quote Calculator</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        form div, .results div { margin-bottom: 1rem; }
        label { display: inline-block; width: 150px; }
        input, select { width: 150px; padding: 5px; }
        button { padding: 8px 15px; margin-right: 10px; }
        hr { margin: 2rem 0; }
        h3 strong { color: #007bff; }
        .results p { display: flex; justify-content: space-between; max-width: 320px; }
    </style>
</head>
<body>

    <h1>Auto Glass Quote Calculator</h1>

    <form id="calculatorForm">
        <h2>Inputs</h2>
        <div>
            <label for="partsAmount">Parts Amount ($):</label>
            <input type="number" id="partsAmount" name="partsAmount" step="0.01" min="0" placeholder="e.g., 150.00">
        </div>
        <div>
            <label for="needsKit">Needs Kit?</label>
            <select id="needsKit" name="needsKit">
                <option value="n" selected>No</option>
                <option value="y">Yes</option>
                <option value="n">No</option>
            </select>
        </div>
        <div>
            <label for="labor">Labor Cost ($):</label>
            <input type="number" id="labor" name="labor" step="0.01" min="0" placeholder="e.g., 100.00">
        </div>
        <div>
            <label for="calibration">Calibration Cost ($):</label>
            <input type="number" id="calibration" name="calibration" step="0.01" min="0" placeholder="e.g., 250.00">
        </div>
        <div>
            <button type="submit">Calculate</button>
            <button type="reset">Reset</button>
        </form>
        </div>
    </form>

    <hr>

    <div class="results">
        <h2>Quote Summary</h2>
        <p>Parts (with margin): <strong id="displayParts">$0.00</strong></p>
        <p>Part Tax: <strong id="displayPartTax">$0.00</strong></p>
        <p>Kit Cost (with tax): <strong id="displayKitCost">$0.00</strong></p>
        <p>Labor: <strong id="displayLabor">$0.00</strong></p>
        <p>Calibration: <strong id="displayCalibration">$0.00</strong></p>
        <hr>
        <h3>Total: <strong id="displayTotal">$0.00</strong></h3>
    </div>

    <!-- This line loads and runs your JavaScript code -->
    <script src="script.js"></script>

</body>
</html>
